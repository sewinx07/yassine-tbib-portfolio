      - {label: "Ordre à la une", name: featuredOrder, widget: number, hint: "1, 2 ou 3 pour les projets à la une. 0 pour les autres."}
      - {label: "Ordre dans l’archive", name: sortOrder, widget: number, hint: "Plus le nombre est petit, plus le projet apparaît tôt."}
